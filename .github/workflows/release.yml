name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gates everything below it. A tagged release used to ship whatever
  # compiled, because nothing here ever ran the tests.
  #
  # Runs on macOS, which is not the obvious choice for a Go project. The
  # reason is cmd/nse-app: it imports the webview binding, which needs the
  # platform's GUI headers, so `go vet ./...` and `go test ./...` fail on a
  # bare Linux runner with "Package 'gtk+-3.0' ... not found". macOS has
  # Cocoa and WebKit built in and needs no packages installed. The
  # alternatives are worse: pinning to ubuntu-22.04 to get the
  # libwebkit2gtk-4.0-dev that 24.04 dropped ties the gate to an image
  # that is itself being retired, and excluding cmd/nse-app by name would
  # silently skip the next package that needs a toolchain — including the
  # tests covering the Windows and Linux browser launchers, which cannot
  # be cross-compiled and have no other automated check.
  #
  # This is free while the repository is public; if it ever goes private,
  # macOS minutes bill at 10x and this is the job to reconsider.
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  portable:
    name: Portable server (all platforms)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: sh scripts/build-portable.sh "${GITHUB_REF_NAME}"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" build/* --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: nse-status-portable
          path: build/*

  macos-app:
    name: Desktop app (macOS universal)
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: sh scripts/build-macos-app.sh "${GITHUB_REF_NAME}"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" build/NSE-Status-macOS-universal.zip --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: nse-app-macos
          path: build/NSE-Status-macOS-universal.zip

  windows-app:
    name: Desktop app (Windows amd64)
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Ensure a C++ toolchain is available (webview.cc needs g++)
        run: choco install mingw -y --no-progress
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-H windowsgui -s -w -X nse-cli/internal/nse.BuildVersion=${env:GITHUB_REF_NAME}" -o build/NSE-Status-windows-amd64.exe ./cmd/nse-app
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${env:GITHUB_REF_NAME}" build/NSE-Status-windows-amd64.exe --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: nse-app-windows
          path: build/NSE-Status-windows-amd64.exe

  linux-app:
    name: Desktop app (Linux amd64, GTK)
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Pinned to 22.04: 24.04 dropped the libwebkit2gtk-4.0-dev package
    # that webview_go's Linux build (#cgo pkg-config: ... webkit2gtk-4.0)
    # depends on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-s -w -X nse-cli/internal/nse.BuildVersion=${GITHUB_REF_NAME}" -o build/NSE-Status-linux-amd64 ./cmd/nse-app
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" build/NSE-Status-linux-amd64 --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: nse-app-linux
          path: build/NSE-Status-linux-amd64

  # Runs last, over the assets actually attached to the release, so the
  # sums cover exactly what a user downloads rather than a local build.
  checksums:
    name: Publish SHA256SUMS
    needs: [portable, macos-app, windows-app, linux-app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # No checkout needed — gh works from GITHUB_REPOSITORY alone.
      - name: Download the release assets, sum them, attach the list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*'
          # Re-running a release must not sum a previous SHA256SUMS, and
          # only regular files are summed so a stray directory cannot fail
          # the job.
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
